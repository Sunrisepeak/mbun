registry=https://registry.npmjs.org/
cache=.cache/bun
enabled=true
flags[]=prefer-offline
flags[]=exact
flags[]=ignore-scripts
token=${TOKEN?}

[scopes]
default=https://registry.npmjs.org/

[scopes.company]
url=https://registry.example.com/
token=${TOKEN}
username=benchmark-user

[install.cache]
dir=.cache/install
disable=false

[install.lockfile]
save=true
print=yarn

[paths]
windows=C:\Users\bench\AppData\Local\bun
escaped=this\;is\#one-value
unicode=packages/应用程序/入口

[metadata]
one=alpha
two=beta
three=gamma
four=delta
five=epsilon
six=zeta
seven=eta
eight=theta
nine=iota
ten=kappa
