# mbun - MC++ (modular C++26) rewrite of Bun. This is the single workspace
# entry point. Members remain grouped by subsystem, while the CLI dependency
# graph and local package index are declared here so `mcpp build` works from
# the repository root.
#
# Inside a member, src/ follows the mcpp module-path convention
# (directory path = module namespace, e.g. src/paths.cppm → module
# mbun.core.paths; a member may hold several related modules).
#
# Layout:
#   modules/core    mbun.core.*   (paths; + strings/collections/alloc as they land)
#   modules/semver  mbun.semver
#   modules/glob    mbun.glob
#   modules/js      mbun.js_*     (js_lexer; + parser/printer/ast — transpiler)
#   modules/jsc     mbun.compat.jsc / mbun.jsc.*   (JavaScriptCore-bound subsystem)
#   src/            the root `mbun` binary package
# Build everything:  mcpp build
# Test everything:  mcpp test --workspace
# Run the CLI:      mcpp run -- --version

[package]
name        = "mbun"
version     = "0.1.0"
description = "mbun CLI — an experimental rewrite of bun in MC++"
license     = "MIT"
standard    = "c++26"

ldflags = ["-Wl,--export-dynamic"]

[dependencies]
jsc      = { path = "modules/jsc" }
semver   = { path = "modules/semver" }
crypto   = { path = "modules/crypto" }
which    = { path = "modules/which" }
dns      = { path = "modules/dns" }
dotenv   = { path = "modules/dotenv" }
install  = { path = "modules/install" }
toml     = { path = "modules/toml" }
bunfig   = { path = "modules/bunfig" }
http     = { path = "modules/http" }
bundler  = { path = "modules/bundler" }
resolver = { path = "modules/resolver" }

[targets.mbun]
kind = "bin"
main = "src/main.cpp"

[indices]
mbun = { path = "mcpp" }

[build]
default-profile = "release"

[profile.release]
opt   = 3
debug = false

[workspace]
members = [
    "modules/core",
    "modules/semver",
    "modules/semver_jsc",
    "modules/glob",
    "modules/image",
    "modules/css",
