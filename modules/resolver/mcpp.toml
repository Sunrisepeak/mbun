[package]
name        = "resolver"
version     = "0.1.0"
description = "mbun.resolver — Node module resolution + package.json exports/imports (pure logic)"
license     = "MIT"
standard    = "c++26"



# core transitively links the local-index mimalloc package. mcpp resolves and
# fetches path dependencies in each consuming member's sandbox, and indices do
# not inherit across members, so the consumer must know the same local index.

# Cross-member: reuse mbun.core.paths for posix path normalize/join/dirname.
[dependencies]
core = { path = "../core" }

[indices]
mbun = { path = "../../mcpp" }
