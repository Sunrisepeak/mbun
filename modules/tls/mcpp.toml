[package]
name        = "tls"
version     = "0.1.0"
description = "mbun.tls — uWS-compatible TLS/socket state and backend seams"
license     = "MIT"
standard    = "c++26"


# Real TLS backend (src/openssl.cpp) links OpenSSL 3.1.5 via the vendored
# local-index package mbun.openssl (see [dependencies.mbun] below), NOT the host
# /usr or toolchain sysroot — project rule: the build must not depend on any host
# library (mcpp-ecosystem / local-index / self-built only) so it is reproducible
# cross-platform and in CI. mbun.openssl wraps the mcpp xim:openssl prebuilt
# (libssl.a/libcrypto.a + headers) and exposes it as a static lib target; its
# ldflags (-l:libssl.a -l:libcrypto.a from the package's own lib dir) reach here
# transitively. bun links BoringSSL; OpenSSL is API-compatible for the
# handshake/read/write surface used here.


# OpenSSL comes from the OFFICIAL registry package compat.openssl, which builds a
# fully static libcrypto.a + libssl.a FROM SOURCE on both linux and macosx. It
# replaces the local-index mbun.openssl, whose own header excluded this option on
# the premise that "mcpp 注册表有 compat.mbedtls，但无 compat.openssl" -- true when
# that file was written, false now: the registry has since gained it. mbun.openssl
# wrapped the xim:openssl PREBUILT, which exists only for linux, and that is what
# stopped the macOS CI probe.
#
# This is a 3.1.5 -> 3.5.1 bump, not a drop-in swap, so it is gated on the crypto
# and TLS corpora rather than assumed compatible.
[dependencies.compat]
openssl = "3.5.1"

[indices]
mbun = { path = "../../mcpp" }
