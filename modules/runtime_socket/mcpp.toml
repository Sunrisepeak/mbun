[package]
name        = "runtime_socket"
version     = "0.1.0"
description = "mbun.runtime_socket — transport-neutral TCP/TLS socket seams"
license     = "MIT"
standard    = "c++26"



# Keep the member on the same local index boundary as its dependencies.

# Cross-member: EpollBackend + EventLoop token dispatch drive the epoll socket backend.
[dependencies]
event_loop = { path = "../event_loop" }

[indices]
mbun = { path = "../../mcpp" }
