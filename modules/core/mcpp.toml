[package]
name        = "core"
version     = "0.1.0"
description = "mbun.core — allocation, collections, strings, paths, and filesystem I/O foundations"
license     = "MIT"
standard    = "c++26"



[profile.asan]
inherits = "release"
debug    = true
cxxflags = ["-fsanitize=address", "-fno-omit-frame-pointer", "-DMBUN_ALLOC_DEBUG_GUARDS=1"]
ldflags  = ["-fsanitize=address"]

[targets.bench-core-io]
kind = "bin"
main = "benches/bench_core_io.cpp"


[dependencies.mbun]
mimalloc = "2.1.7+mbun.1"

[targets.bench-string-width]
kind = "bin"
main = "benches/bench_string_width.cpp"

[indices]
mbun = { path = "../../mcpp" }
