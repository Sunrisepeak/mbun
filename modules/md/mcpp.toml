[package]
name        = "md"
version     = "0.1.0"
description = "mbun.md — Markdown parser and renderers (initial port skeleton)"
license     = "MIT"
standard    = "c++26"



# core transitively links the local-index mimalloc package; indices do not
# inherit across members, so the consumer must declare the same local index.

[dependencies]
core = { path = "../core" }

[indices]
mbun = { path = "../../mcpp" }
