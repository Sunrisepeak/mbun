# T0.2 CI: 双工具链 (gcc16 / llvm22) 构建 + 测试
# 跨平台矩阵 (macos / windows) 待 linux 稳定后跟进 (docs/plan T0.2)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["gcc@16.1.0", "llvm@22.1.8"]
    steps:
      - uses: actions/checkout@v4

      # Repo hygiene, before anything expensive. Both checks guard damage that
      # is INVISIBLE to a build:
      #  - a conflict marker inside a C++ raw string literal (where the JS
      #    payloads live) compiles clean and ships broken JS;
      #  - a compat/ submodule staged as a symlink still resolves on the machine
      #    that created it, so the corpora look fine there and are simply absent
      #    everywhere else. That one reached a merge commit undetected.
      # Seconds to run, and neither can be caught later by a green build.
      - name: Repo hygiene
        run: |
          bash tools/integration/check_conflict_markers.sh
          bash tools/integration/check_submodule_gitlinks.sh

      # `build-cache` is deliberately EXCLUDED, and that exclusion is the whole
      # point of the v3 key bump.
      #
      # This step caches toolchains and BMI, as its name says -- but `path:
      # ~/.mcpp` also swept in `~/.mcpp/build-cache`, the compiled-object cache
      # for registry packages. That cache is keyed by a config hash that does
      # NOT include the mcpp version, while `Install mcpp` below always installs
      # `latest`. So when mcpp changed how it names a package's object files,
      # every run kept restoring objects laid out by the OLD mcpp and then built
      # with the new one, and `restore-keys` prefix-matching guaranteed a
      # poisoned entry was always found. Deleting the caches by hand did not help
      # for the same reason: any surviving entry under the prefix repopulates.
      #
      # Measured 2026-07-31: CI failed on
      #   ninja: error: '.../compat.zstd@1.5.7/80f379b3dc1bf6f3/obj/compat_zstd/
      #   zstd-1.5.7/lib/common/xxhash.o', needed by 'obj/compat_zstd/...'
      # i.e. a ninja demanding NESTED object paths. Reproducing that exact config
      # hash (80f379b3dc1bf6f3) locally from a cold package resolve -- same mcpp
      # version, same `mcpp build --workspace`, same toolchain override -- emits
      # a FLAT `obj/xxhash.o` and links fine. Same inputs, same hash, different
      # layout: the only difference was the restored cache. The base branch was
      # red from this too, having been green through 07-26, so it was never
      # anything in a PR.
      #
      # Rebuilding registry packages from source costs ~6s (zstd/zlib/brotli are
      # small C); the toolchains are what is actually expensive to fetch, and
      # they still cache.
      - name: Cache mcpp home (toolchains + BMI)
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp
            !~/.mcpp/build-cache
          key: mcpp-v3-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/mcpp.lock') }}
          restore-keys: mcpp-v3-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Install mcpp
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh | bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: |
          mcpp --version
          # gcc provides the base subos runtime (libstdc++.so.6 / libgcc_s.so.1)
          # that the LLVM clang binary links against — without it clang exits 127.
          mcpp toolchain install gcc 16
          compiler="${TOOLCHAIN%@*}"; version="${TOOLCHAIN#*@}"
          if [ "$compiler" != "gcc" ]; then
            mcpp toolchain install "$compiler" "${version%%.*}"
          fi
          mcpp toolchain list
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Build
        run: |
          # Workspace root [toolchain] is inherited by all members.
          printf '\n[toolchain]\ndefault = "%s"\n' "$TOOLCHAIN" >> mcpp.toml
          mcpp build --workspace --verbose
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Test
        run: |
          if [ "${TOOLCHAIN%@*}" = "gcc" ]; then
            mcpp test --workspace
          else
            # The prebuilt JavaScriptCore ships libstdc++-ABI symbols (std::span
            # in WTF headers): a libc++ lane compiles everything but cannot LINK
            # the JSC-binding test binaries, so modules/jsc tests are gcc-only.
            # test_members.sh is silent by design (per-member logs); surface the
            # failing members and their log tails when it fails.
            if ! SKIP_MEMBERS="modules/jsc" tools/integration/test_members.sh; then
              results="target/integration/member-results.tsv"
              echo "failed members:"; awk -F'\t' '$3=="fail"{print "  " $1}' "$results"
              awk -F'\t' '$3=="fail"{print $5}' "$results" | while read -r log; do
                echo "::group::$log"; tail -60 "$log"; echo "::endgroup::"
              done
              exit 1
            fi
          fi
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Smoke
        # The root binary links the prebuilt JSC — gcc lane only (same ABI note).
        if: startsWith(matrix.toolchain, 'gcc')
        run: mcpp run -- --version

      - name: Smoke (example apps)
        # Boots every examples/ app, hits 127.0.0.1:3000, asserts 2xx, reaps it.
        # Same gcc-only reason as above. The framework demos (express, elysia)
        # report as skipped here: their node_modules are not in the checkout and
        # `mbun install` does not currently finish for them (measured: still
        # running past a 880s bound on examples/bun/elysia). Add --install to
        # this command once that is fixed, and the demos boot in CI too.
        if: startsWith(matrix.toolchain, 'gcc')
        run: |
          MBUN="$(find target -type f -name mbun -perm -111 -printf '%T@ %p\n' \
            | sort -rn | head -1 | cut -d' ' -f2)"
          python3 tools/integration/smoke_examples.py --bin "$MBUN" \
            --out target/integration/smoke

      - name: Smoke logs
        if: failure() && startsWith(matrix.toolchain, 'gcc')
        run: |
          for log in target/integration/smoke/logs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"; tail -60 "$log"; echo "::endgroup::"
          done
