# T0.2 CI: 双工具链 (gcc16 / llvm22) 构建 + 测试
# 跨平台矩阵 (macos / windows) 待 linux 稳定后跟进 (docs/plan T0.2)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["gcc@16.1.0", "llvm@22.1.8"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache mcpp home (toolchains + BMI)
        uses: actions/cache@v4
        with:
          path: ~/.mcpp
          key: mcpp-v2-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/mcpp.lock') }}
          restore-keys: mcpp-v2-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Install mcpp
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh | bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: |
          mcpp --version
          # gcc provides the base subos runtime (libstdc++.so.6 / libgcc_s.so.1)
          # that the LLVM clang binary links against — without it clang exits 127.
          mcpp toolchain install gcc 16
          compiler="${TOOLCHAIN%@*}"; version="${TOOLCHAIN#*@}"
          if [ "$compiler" != "gcc" ]; then
            mcpp toolchain install "$compiler" "${version%%.*}"
          fi
          mcpp toolchain list
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Build
        run: |
          # Workspace root [toolchain] is inherited by all members.
          printf '\n[toolchain]\ndefault = "%s"\n' "$TOOLCHAIN" >> mcpp.toml
          mcpp build --workspace --verbose
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Test
        run: |
          if [ "${TOOLCHAIN%@*}" = "gcc" ]; then
            mcpp test --workspace
          else
            # The prebuilt JavaScriptCore ships libstdc++-ABI symbols (std::span
            # in WTF headers): a libc++ lane compiles everything but cannot LINK
            # the JSC-binding test binaries, so modules/jsc tests are gcc-only.
            # test_members.sh is silent by design (per-member logs); surface the
            # failing members and their log tails when it fails.
            if ! SKIP_MEMBERS="modules/jsc" tools/integration/test_members.sh; then
              results="target/integration/member-results.tsv"
              echo "failed members:"; awk -F'\t' '$3=="fail"{print "  " $1}' "$results"
              awk -F'\t' '$3=="fail"{print $5}' "$results" | while read -r log; do
                echo "::group::$log"; tail -60 "$log"; echo "::endgroup::"
              done
              exit 1
            fi
          fi
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Smoke
        # The root binary links the prebuilt JSC — gcc lane only (same ABI note).
        if: startsWith(matrix.toolchain, 'gcc')
        run: mcpp run -- --version
